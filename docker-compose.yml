services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-iotdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-iotdb}
      PORT: 3000
      NODE_ENV: production
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT}
      AWS_IOT_KEY_PATH: /certs/private.pem.key
      AWS_IOT_CERT_PATH: /certs/certificate.pem.crt
      AWS_IOT_CA_PATH: /certs/AmazonRootCA1.pem
    volumes:
      - ./certs:/certs:ro
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TENANT_ID=${VITE_TENANT_ID:-tenant-3}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5000:80"

volumes:
  postgres_data:
